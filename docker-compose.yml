services:
  api:
    build: ./backend
    container_name: algo-dashboard-api
    ports:
      - "8010:8000"
    environment:
      CORS_ORIGINS: "http://localhost:3010"
      QX_DATA_DIR: /app/data
      QX_LOG_DIR: /app/data/logs
      DASHBOARD_API_KEY: "${DASHBOARD_API_KEY:-}"
      DASHBOARD_ADMIN_USER: "${DASHBOARD_ADMIN_USER:-}"
      DASHBOARD_ADMIN_PASSWORD_HASH: "${DASHBOARD_ADMIN_PASSWORD_HASH:-}"
      DASHBOARD_SESSION_SECRET: "${DASHBOARD_SESSION_SECRET:-}"
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-0}"
      REDIS_URL: "${REDIS_URL:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - qx-data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: "http://localhost:8010"
    container_name: algo-dashboard-web
    ports:
      - "3010:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qx-data:
