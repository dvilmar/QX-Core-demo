services:
  postgres:
    image: postgres:16-alpine
    container_name: algo-dashboard-postgres
    environment:
      POSTGRES_USER: qx
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: qx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: algo-dashboard-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    container_name: algo-dashboard-postgres-backup
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: qx
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      PGDATABASE: qx
    volumes:
      - ./infra/postgres/backup.sh:/backup.sh:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-backups:
